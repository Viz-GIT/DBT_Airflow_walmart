models:
  - name: products
    columns:
      - name: product_id
        data_tests: 
          - not_null
          - unique:
              config:
                where: "TRY_CAST(price AS DECIMAL(10,2)) > 0"

  - name: orders
    columns:
      - name: order_id
        data_tests: 
          - not_null
          - unique